<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Página no encontrada  | JOTA</title>
    <meta name="description" content="Esta página no existe. Vuelve al portafolio de Joel López.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">

    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css">

    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            background: #050505;
        }

        .error-code {
            font-family: 'Clash Display', sans-serif;
            font-size: clamp(6rem, 20vw, 14rem);
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(135deg, #9b72cf, #e4d3f5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
        }

        .error-title {
            font-family: 'Clash Display', sans-serif;
            font-size: clamp(1.2rem, 3vw, 2rem);
            font-weight: 500;
            color: #f4f4f5;
            margin: 1rem 0 0.5rem;
        }

        .error-desc {
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            color: #A3A3A3;
            margin-bottom: 2.5rem;
            max-width: 380px;
        }

        .error-back {
            display: inline-block;
            padding: 0.85rem 2rem;
            background: #9b72cf;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.9rem;
            letter-spacing: 0.03em;
            text-decoration: none;
            border-radius: 100px;
            transition: background 0.3s ease, transform 0.3s ease;
        }

        .error-back:hover {
            background: #7d4bbc;
            transform: translateY(-2px);
        }
    </style>
    <link rel="canonical" href="http://jota-works.com/404.html">
</head>

<body>
    <main class="error-page">
        <p class="error-code">404</p>
        <h1 class="error-title">Página no encontrada</h1>
        <p class="error-desc">Parece que esta página no existe o fue movida. Vuelve al inicio y explora el portafolio.</p>
        <a href="index.html" class="error-back">← Volver al inicio</a>
    </main>
</body>

</html>
